<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Expense</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <div class="container">

        <div class="form-card">

            <h1>Edit Expense</h1>


            <form method="POST">

                <!-- Title -->

                <label for="title">
                    Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ expense['title'] }}"
                    required
                >


                <!-- Amount -->

                <label for="amount">
                    Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    value="{{ expense['amount'] }}"
                    min="0.01"
                    step="0.01"
                    required
                >


                <!-- Category -->

                <label for="category">
                    Category
                </label>

                <select
                    id="category"
                    name="category"
                    required
                >

                    <option value="">
                        Select Category
                    </option>

                    <option
                        value="Food"
                        {% if expense['category'] == 'Food' %}
                            selected
                        {% endif %}
                    >
                        Food
                    </option>

                    <option
                        value="Travel"
                        {% if expense['category'] == 'Travel' %}
                            selected
                        {% endif %}
                    >
                        Travel
                    </option>

                    <option
                        value="Bills"
                        {% if expense['category'] == 'Bills' %}
                            selected
                        {% endif %}
                    >
                        Bills
                    </option>

                    <option
                        value="Shopping"
                        {% if expense['category'] == 'Shopping' %}
                            selected
                        {% endif %}
                    >
                        Shopping
                    </option>

                    <option
                        value="Health"
                        {% if expense['category'] == 'Health' %}
                            selected
                        {% endif %}
                    >
                        Health
                    </option>

                    <option
                        value="Education"
                        {% if expense['category'] == 'Education' %}
                            selected
                        {% endif %}
                    >
                        Education
                    </option>

                    <option
                        value="Entertainment"
                        {% if expense['category'] == 'Entertainment' %}
                            selected
                        {% endif %}
                    >
                        Entertainment
                    </option>

                    <option
                        value="Other"
                        {% if expense['category'] == 'Other' %}
                            selected
                        {% endif %}
                    >
                        Other
                    </option>

                </select>


                <!-- Date -->

                <label for="date">
                    Date
                </label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    value="{{ expense['date'] }}"
                    required
                >


                <!-- Actions -->

                <div class="form-actions">

                    <button type="submit">
                        Update Expense
                    </button>

                    <a
                        href="{{ url_for('home') }}"
                        class="button"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>

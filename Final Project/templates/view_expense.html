<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Expense Details</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <div class="container">

        <div class="form-card">

            <h1>Expense Details</h1>


            <div class="expense-details">

                <p>
                    <strong>Title:</strong>
                    {{ expense["title"] }}
                </p>

                <p>
                    <strong>Amount:</strong>
                    ₹{{ expense["amount"] }}
                </p>

                <p>
                    <strong>Category:</strong>
                    {{ expense["category"] }}
                </p>

                <p>
                    <strong>Date:</strong>
                    {{ expense["date"] }}
                </p>

            </div>


            <div class="form-actions">

                <a
                    href="{{ url_for(
                        'edit_expense',
                        id=expense['id']
                    ) }}"
                    class="button"
                >
                    Edit
                </a>


                <a
                    href="{{ url_for('home') }}"
                    class="button"
                >
                    Back to Expenses
                </a>

            </div>

        </div>

    </div>

</body>

</html>
